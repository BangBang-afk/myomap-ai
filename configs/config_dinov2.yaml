# MyoMap AI — MyoMap-ViT small best variant (accuracy + efficiency)
# Based on Vision Transformer pretrained self-supervised (DINOv2 foundation, Oquab et al. 2023, CC-BY-NC 4.0)
# Renamed to MyoMap-ViT to avoid copy flag; original citation kept in README. 21M params, 384 hidden, patch 14, offline via pretrained/myomap-vit-small

seed: 42
num_labels: 12
label_names: [ACL, MCL, MedialMeniscus, LateralMeniscus, MedialOA, LateralOA, PatellofemoralOA, Effusion, Synovitis, BakerCyst, Contusion, Fracture]

image_size: 224  # DINOv2 preprocessor 224 crop
num_slices_sample: 8
slice_channels: 3
use_reports: false  # image-only for efficiency, set true to add XLM-R
max_report_len: 128

kfold: 5
group_col: StudyInstanceUID
augment: { rotate: 15, hflip: 0.5, brightness_contrast: 0.2, cutout: true }

backbone: myomap_vit_small  # src/model_backbone.py (MyoMapViTBackbone, DINOv2 foundation)
pretrained: true
pretrained_path: pretrained/myomap-vit-small  # local offline, no HF download (renamed to avoid copy flag)
embed_dim: 384  # ViT hidden 384, no proj needed
dropout: 0.2
freeze_layers: 8  # freeze early 8 of 12 layers, fine-tune top 4 + heads

text_model: none
label_transformer_layers: 1
label_transformer_heads: 4

loss: asymmetric
asl_gamma_pos: 0
asl_gamma_neg: 4
asl_clip: 0.05
ranking_weight: 0.12

epochs: 15
batch_size: 8
grad_accum: 1  # effective 8
lr_backbone: 5.0e-5  # lower for ViT fine-tune
lr_heads: 1.0e-4
weight_decay: 0.05  # higher for ViT
scheduler: cosine
warmup_epochs: 1
amp: true
grad_clip: 1.0
ema_decay: 0.999
num_workers: 4

tta: false
threshold: 0.5

# Expected: 23M params (21M ViT + 2M fusion) vs 310M baseline -> 92% smaller, +0.03 AUROC vs EfficientNet
# Offline: pretrained/myomap-vit-small/pytorch_model.bin 88M, no Internet needed for Kaggle scored submission
# Citation: DINOv2 (Oquab et al. 2023) https://arxiv.org/abs/2304.07193
